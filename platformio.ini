; PlatformIO Project Configuration File for ESP32-C3 Super Mini Plus
; Euro 5 CAN Bus Sniffer for 2026 Yamaha MT-09 SP

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Native USB-C CDC serial configuration for ESP32-C3
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

