; =============================================================================
; 🏍️ Yamaha MT-09 SP (Euro 5+) CAN Bus Tool & Cockpit Suite
; Target MCU: ESP32-C3 Super Mini Plus (RISC-V 160MHz, 4MB Flash, Native USB CDC)
; =============================================================================

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 1
monitor_rts = 1

; Native USB-C CDC serial configuration for ESP32-C3
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

; Dual 1.9MB OTA partition scheme (enables seatless wireless firmware updates)
board_build.partitions = min_spiffs.csv
